# 右上角展示GitHub仓库
repo_url: https://github.com/Gongzihang6/gzhSLAM
repo_name: Gongzihang6/gzhSLAM
edit_uri: edit/master/docs/ # 允许读者点击编辑按钮跳转到源码

# 插件配置
plugins:
    #     - caption     # 显示图片题注
    - callouts # 让mkdocs识别>[!note]语法
    - search
    - git-revision-date-localized:
          type: date
          enable_creation_date: true
    - glightbox:
          touchNavigation: true
          loop: false
          effect: zoom # zoom, fade, etc.
          width: 100%
          height: auto
          zoomable: true
          draggable: true
extra:
    # analytics:
    #   provider: google # ...你的谷歌分析配置

    # 评论系统配置
    comments:
        provider: giscus
        repo: Gongzihang6/gzhSLAM
        repo_id: R_kgDOQ6zUcQ # 从你截图里提取的 data-repo-id
        category: General # 从你截图里提取的 data-category
        category_id: DIC_kwDOQ6zUcc4C1BBy # 从你截图里提取的 data-category-id
        mapping: pathname # 对应 data-mapping="pathname"
        reactions_enabled: true # 对应 data-reactions-enabled="1"
        emit_metadata: false
        input_position: top # 对应 input-position="top"，评论框在评论列表上方
        lang: zh-CN # 对应 data-lang="zh-CN"
        # theme: preferred_color_scheme # 主题会自动跟随网站的日间/夜间模式，不用手动设

# 注册自定义 CSS 文件
extra_css:
