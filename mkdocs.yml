# mkdocs.yml
site_name: SLAM学习之旅
site_url: https://github.com/Gongzihang6/gzhSLAM/
site_author: Gongzihang6

# 主题设置
theme:
    name: material
    custom_dir: overrides # 告诉 mkdocs 去这里找自定义模板
    language: zh # 中文界面
    features:
        - toc.follow # 支持typora中的顶部[toc]目录
        - navigation.tabs # 顶部导航栏
        - navigation.sections # 侧边栏分组
        - navigation.expand # 默认展开侧边栏
        - navigation.top # 返回顶部按钮
        - search.suggest # 搜索建议
        - search.highlight # 搜索高亮
    palette:
        # 浅色模式配置
        - scheme: default
          primary: grey # 主色调
          accent: purple
          toggle:
              icon: material/weather-sunny
              name: Switch to dark mode
        # 深色模式配置
        - scheme: slate
          primary: grey
          accent: lime
          toggle:
              icon: material/weather-night
              name: Switch to light mode

# 必要的扩展 (支持数学公式和更丰富的 Markdown 语法)
markdown_extensions:
    - pymdownx.mark # 支持markdown的==高亮
    - toc:
          permalink: true # 可选：为标题添加锚点链接
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.highlight:
          anchor_linenums: true

# 数学公式渲染引擎 (MathJax)
extra_javascript:
    - javascripts/mathjax.js
    - https://polyfill.io/v3/polyfill.min.js?features=es6
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

